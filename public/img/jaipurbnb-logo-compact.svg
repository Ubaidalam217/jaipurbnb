<!--
  Compact lockup for the navbar and footer, where the logo is rendered at a
  fixed 48-65px height.

  Identical artwork to jaipurbnb-logo.svg with the tagline and its two gold
  rules removed. At 65px tall the tagline renders about 2.5px high - it is
  not legible at any size we use in the chrome, so it only steals height
  from the mark. Dropping it lets the viewBox close to 620 units instead of
  709, which scales the arch, palace and wordmark 29% larger than the
  original 800-unit canvas at the same CSS height.

  Artwork bounds here: x 240..897.9, y 5..611. Keep jaipurbnb-logo.svg as
  the master (full lockup with tagline) for print, social and any large
  placement where the tagline is actually readable.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="232 0 676 620" role="img" aria-labelledby="title desc">
  <title id="title">Jaipurbnb Logo</title>
  <desc id="desc">Jaipur hospitality logo with Rajasthani arch, palace silhouette and house roof above the Jaipurbnb wordmark.</desc>
  <defs>
    <linearGradient id="archGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#E96A79"/>
      <stop offset="50%" stop-color="#C8324E"/>
      <stop offset="100%" stop-color="#F08B73"/>
    </linearGradient>
    <linearGradient id="palaceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F28A73"/>
      <stop offset="100%" stop-color="#D84A5F"/>
    </linearGradient>
    <style>
      .navy{fill:#162655}
      .rose{fill:#D83F63}
      .brown{fill:#5A4036}
    </style>
  </defs>
  <path d="M360 435 L360 282 C360 225 388 192 430 174 C431 124 457 102 499 87 C548 69 580 42 600 15 C620 42 652 69 701 87 C743 102 769 124 770 174 C812 192 840 225 840 282 L840 435" fill="none" stroke="url(#archGrad)" stroke-width="20" stroke-linecap="round"/>
  <circle cx="505" cy="168" r="18" fill="#EA8B2A"/>
  <path d="M455 205 q12 -10 24 0 q12 -10 24 0" fill="none" stroke="#5A4036" stroke-width="4" stroke-linecap="round"/>
  <path d="M502 222 q9 -7 18 0 q9 -7 18 0" fill="none" stroke="#5A4036" stroke-width="3" stroke-linecap="round"/>
  <g fill="url(#palaceGrad)">
    <rect x="398" y="292" width="62" height="132" rx="2"/>
    <rect x="407" y="274" width="44" height="18"/>
    <path d="M408 274 q21 -33 42 0 z"/>
    <circle cx="429" cy="245" r="4"/>
    <rect x="427" y="232" width="4" height="12"/>
    <rect x="500" y="255" width="200" height="170" rx="4"/>
    <rect x="525" y="232" width="150" height="28"/>
    <path d="M545 232 q25 -35 50 0 z"/>
    <path d="M605 232 q25 -48 50 0 z"/>
    <circle cx="630" cy="193" r="5"/>
    <rect x="627" y="177" width="6" height="14"/>
    <path d="M655 232 q25 -35 50 0 z"/>
    <rect x="704" y="310" width="58" height="114"/>
    <path d="M711 310 q22 -30 44 0 z"/>
  </g>
  <g fill="#FFF1E9">
    <path d="M411 322 q18 -28 36 0 v50 h-36z"/>
    <path d="M520 291 q17 -27 34 0 v44 h-34z"/>
    <path d="M562 291 q17 -27 34 0 v44 h-34z"/>
    <path d="M604 291 q17 -27 34 0 v44 h-34z"/>
    <path d="M646 291 q17 -27 34 0 v44 h-34z"/>
    <path d="M714 337 q18 -27 36 0 v44 h-36z"/>
  </g>
  <g fill="none" stroke="#FFF1E9" stroke-width="6">
    <path d="M515 375 q20 -28 40 0"/>
    <path d="M560 375 q20 -28 40 0"/>
    <path d="M605 375 q20 -28 40 0"/>
    <path d="M650 375 q20 -28 40 0"/>
  </g>
  <path d="M360 435 L600 315 L840 435 L798 435 L600 340 L402 435 Z" fill="#D83F63"/>
  <path d="M600 340 L780 435 L420 435 Z" fill="#FFFDF7"/>
  <rect x="585" y="390" width="30" height="30" fill="#5A4036"/>
  <rect x="600" y="390" width="2" height="30" fill="#FFFDF7"/>
  <rect x="585" y="404" width="30" height="2" fill="#FFFDF7"/>
  <text x="240" y="585" font-size="118" font-family="Georgia, 'Times New Roman', serif" class="navy" letter-spacing="-3">Jaipur</text>
  <text x="705" y="585" font-size="118" font-family="Georgia, 'Times New Roman', serif" class="rose" letter-spacing="-3">bnb</text>
</svg>
